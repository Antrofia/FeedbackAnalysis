name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore FeedbackAnalysis.slnx

      - name: Build
        run: dotnet build FeedbackAnalysis.slnx --no-restore --nologo

      - name: Test
        run: dotnet test FeedbackAnalysis.slnx --no-build --nologo
